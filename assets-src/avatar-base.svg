<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>

  <!-- background disc -->
  <circle cx="120" cy="120" r="120" fill="url(#bg)"/>

  <!-- shoulders / hoodie -->
  <path d="M 40 240 C 42 198 76 174 120 174 C 164 174 198 198 200 240 Z" fill="#6366F1"/>
  <path d="M 40 240 C 42 198 76 174 120 174 C 164 174 198 198 200 240 Z" fill="black" opacity="0.05"/>
  <!-- hood collar -->
  <path d="M 86 180 C 96 198 144 198 154 180 C 144 174 96 174 86 180 Z" fill="#4F46E5"/>
  <!-- drawstrings -->
  <path d="M 108 192 L 106 216" stroke="#EEF2FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M 132 192 L 134 216" stroke="#EEF2FF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="106" cy="219" r="3.5" fill="#EEF2FF"/>
  <circle cx="134" cy="219" r="3.5" fill="#EEF2FF"/>

  <!-- neck -->
  <path d="M 104 152 h 32 v 24 c 0 8 -32 8 -32 0 Z" fill="#F2B98D"/>

  <!-- ears -->
  <ellipse cx="66" cy="122" rx="10" ry="13" fill="#F8C99B"/>
  <ellipse cx="174" cy="122" rx="10" ry="13" fill="#F8C99B"/>
  <path d="M 68 120 q 4 3 1 7" stroke="#E8A87C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 172 120 q -4 3 -1 7" stroke="#E8A87C" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- face -->
  <path d="M 70 110 C 70 72 92 54 120 54 C 148 54 170 72 170 110 C 170 146 148 172 120 172 C 92 172 70 146 70 110 Z" fill="#F8C99B"/>

  <!-- hair: solid dome + fringe locks -->
  <path d="M 63 116 C 59 54 90 36 120 36 C 150 36 181 54 177 116 C 174 112 170 108 165 106 L 75 106 C 70 108 66 112 63 116 Z" fill="#23272F"/>
  <!-- fringe locks hanging over forehead -->
  <path d="M 75 96 C 81 97 87 97 93 96 C 93 104 90 109 85 110 C 79 108 76 102 75 96 Z" fill="#23272F"/>
  <path d="M 96 94 C 103 96 111 96 118 94 C 117 106 113 113 107 115 C 100 110 97 102 96 94 Z" fill="#23272F"/>
  <path d="M 121 94 C 128 96 136 96 143 94 C 144 103 140 110 133 112 C 126 108 122 101 121 94 Z" fill="#23272F"/>
  <path d="M 146 96 C 152 98 158 98 164 96 C 165 103 162 108 156 110 C 150 108 147 102 146 96 Z" fill="#23272F"/>
  <!-- side sweep -->
  <path d="M 160 62 C 138 64 118 74 108 94 C 124 84 144 78 162 78 C 166 72 164 66 160 62 Z" fill="#2E333E"/>

  <!-- eyebrows -->
  <path d="M 86 114 q 10 -6 22 -2" stroke="#2A2E38" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M 132 112 q 11 -4 22 2" stroke="#2A2E38" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="98" cy="126" rx="5" ry="7" fill="#262A33"/>
  <ellipse cx="142" cy="126" rx="5" ry="7" fill="#262A33"/>
  <circle cx="96" cy="123.5" r="1.8" fill="white"/>
  <circle cx="140" cy="123.5" r="1.8" fill="white"/>

  <!-- nose -->
  <path d="M 120 132 q 4 6 -2 10" stroke="#E8A87C" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- mouth: gentle smile -->
  <path d="M 106 151 Q 120 160 134 151" stroke="#B4634A" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="85" cy="142" rx="8" ry="4.5" fill="#F5A884" opacity="0.5"/>
  <ellipse cx="155" cy="142" rx="8" ry="4.5" fill="#F5A884" opacity="0.5"/>
</svg>
