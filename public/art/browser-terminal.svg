<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B2333"/>
      <stop offset="1" stop-color="#141C2E"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="624" height="344" rx="22" fill="#0B0F18"/>
  <rect x="8" y="8" width="624" height="344" rx="22" fill="none" stroke="#2A3548" stroke-width="2"/>

  <!-- title bar -->
  <path d="M 8 52 a 22 22 0 0 1 22 -22 h 580 a 22 22 0 0 1 22 22 v 12 H 8 Z" fill="url(#hdr)"/>
  <circle cx="38" cy="36" r="7" fill="#FF5F57"/>
  <circle cx="62" cy="36" r="7" fill="#FEBC2E"/>
  <circle cx="86" cy="36" r="7" fill="#28C840"/>
  <!-- url bar -->
  <rect x="112" y="24" width="420" height="24" rx="12" fill="#0B0F18"/>
  <circle cx="128" cy="36" r="4.5" fill="#34D399"/>
  <text x="142" y="41" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7DD3FC">kael-odin.github.io</text>

  <!-- terminal body -->
  <text x="40" y="104" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#34D399">$ whoami</text>
  <text x="40" y="138" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#E2E8F0" font-weight="bold">汤勇 · Kael Odin</text>

  <text x="40" y="178" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#34D399">$ cat role.txt</text>
  <text x="40" y="212" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#93C5FD">开发者 / Web &amp; AI 工具 / 终身学习中</text>

  <text x="40" y="252" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#34D399">$ uptime</text>
  <text x="40" y="286" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#C4B5FD">building since day one · 0 个念头被浪费</text>

  <!-- cursor -->
  <rect x="40" y="308" width="11" height="22" fill="#22D3EE">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- corner glow -->
  <circle cx="600" cy="320" r="70" fill="#3B82F6" opacity="0.12"/>
  <circle cx="600" cy="320" r="40" fill="#22D3EE" opacity="0.12"/>
</svg>
